name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -B -m py_compile cache_gate.py tests/test_cache_gate.py
      - run: python3 -B tests/test_cache_gate.py
      - run: bash -n install.sh
